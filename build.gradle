plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.runelite.net')
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
}

group = 'com.coxgearplanner'
version = '1.64'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
}

// Launches a RuneLite dev client with the plugin loaded: gradlew runClient
tasks.register('runClient', JavaExec) {
    group = 'application'
    description = 'Run a RuneLite client with the CoX Gear Planner plugin loaded'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.coxgearplanner.CoxGearPlannerPluginTest'
    enableAssertions = true
}
